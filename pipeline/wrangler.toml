name = "sfb-valuation"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
WM_KEY_VERSION = "1"
# Schedule watchdog (scheduled handler in src/index.js): GitHub delays and drops the pipeline's 30-minute schedule for
# hours at a time, so every 20 minutes this Worker starts a `continue` run itself when no pipeline run is in progress
# and none started in the last WATCHDOG_GAP_MIN minutes. It needs the secret GH_DISPATCH_TOKEN (a fine-grained GitHub
# token for GH_REPO with Actions: read and write); without it the cron does nothing and the pipeline opens a
# [schedule-gap] issue when runs arrive hours apart. Move GH_REPO with the repository.
GH_REPO = "v3vermillion/sfb-valuation"
GH_BRANCH = "main"
WATCHDOG_GAP_MIN = "40"
# Strongsville Supercenter (8585 Pearl Rd): live prices are this store's shelf prices, like the app's (data/store.json).
# (Until 2026-10-20 this line sat under [triggers], where wrangler ignores it, so the live check answered with
# Walmart.com's price and priceSource "online"; /health shows STORE_ID.)
STORE_ID = "2266"

[triggers]
crons = ["*/20 * * * *"]

# Shared remembered matches (GET/POST /v1/learned, src/index.js class Learned): one SQLite-backed Durable Object, created
# by the migration on deploy, no dashboard step; SQLite-backed objects are the kind the Workers Free plan allows.
[[durable_objects.bindings]]
name = "LEARNED"
class_name = "Learned"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Learned"]

# Public live price check (GET /v1/price/<gtin>). Two limits, both charged only when a Walmart call is made:
# 30 per caller (IP) per minute, and 20 Walmart calls per minute in total (counted per Cloudflare location) so the
# shared key, which the crawler paces at about 8 calls a minute, is never pushed into rate limiting from the app. namespace_id must be unique per account; any small integer works.
# Without these bindings the route answers 503 (it fails closed).
[[ratelimits]]
name = "PRICE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "PRICE_GLOBAL_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }
