name: tests

# Python (crawler) and app unit tests on every pull request and on pushes to main.
# A failure on main opens the "[tests-failed]" alert issue; the next green run on main closes it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt pyyaml
      - name: Crawler tests
        run: python -m unittest discover tests -v
      - name: Workflow and action files parse
        run: |
          set -u
          for f in .github/workflows/*.yml .github/actions/*/action.yml; do
            python3 -c "import yaml, sys; yaml.safe_load(open(sys.argv[1]))" "$f" || { echo "::error::$f does not parse"; exit 1; }
            echo "ok $f"
          done
      - name: Config files parse
        run: |
          set -u
          for f in data/*.json; do
            python3 -c "import json, sys; json.load(open(sys.argv[1]))" "$f" || { echo "::error::$f does not parse"; exit 1; }
            echo "ok $f"
          done

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: App tests
        run: node --test tests/*.test.mjs

  app-ui:
    # the layout, price-status and walkthrough rules of the real app in Chromium (app/tools/ui-check.mjs), on a small
    # fixture: every check is named by the defect it guards (docs/UI-AUDIT.md); scroll-check runs in Chromium and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # app/ has no package-lock.json, so `npm ci` cannot run: install from package.json, then Chromium and WebKit (the
      # engine of every iPhone browser) with their libraries
      - name: Install Playwright, Chromium and WebKit
        run: |
          set -eu
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Build a small fixture, its pack and the site
        run: |
          set -eu
          pip install -q -r ../requirements.txt
          python3 tools/make_fixture.py --store build/fixture-store --items 3000 --equivalents 300
          node tools/build-db.mjs --store build/fixture-store --out dist/db
          node tools/build-site.mjs
      - name: Serve dist
        run: |
          set -u
          nohup node tools/serve.mjs dist 8787 > build/serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8787/ && { echo "serving (check $i)"; exit 0; }
            sleep 1
          done
          echo "::error::the local server did not answer"; cat build/serve.log; exit 1
      - name: Layout, status and walkthrough checks
        run: node tools/ui-check.mjs --json build/ui-check.json
      - name: Scrolling and touch checks (Chromium)
        if: ${{ !cancelled() }}
        run: node tools/scroll-check.mjs --browser chromium
      - name: Scrolling and touch checks (WebKit)
        if: ${{ !cancelled() }}
        run: node tools/scroll-check.mjs --browser webkit

  report:
    # only on main: open or close the tests-failed alert
    needs: [python, app, app-ui]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Alert tests-failed
        if: needs.python.result != 'success' || needs.app.result != 'success' || needs.app-ui.result != 'success'
        uses: ./.github/actions/alert
        with:
          key: tests-failed
          title: tests failing on main
          body: |
            The test suite failed on main (python: ${{ needs.python.result }}, app: ${{ needs.app.result }}, app-ui: ${{ needs.app-ui.result }}).
            Commit `${{ github.sha }}`. The next green run on main closes this issue.
      - name: Resolve tests-failed
        if: needs.python.result == 'success' && needs.app.result == 'success' && needs.app-ui.result == 'success'
        uses: ./.github/actions/alert
        with:
          mode: resolve
          key: tests-failed
